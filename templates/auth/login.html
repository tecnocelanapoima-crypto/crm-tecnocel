<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Tecnocel CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #050D1A; min-height: 100vh; display: flex; align-items: center; }
        .auth-card { background: #0A1628; border: 1px solid rgba(0,207,255,0.2); border-radius: 16px; }
        .brand-title { color: #00CFFF; font-weight: 800; letter-spacing: -0.5px; }
        .btn-cyan { background: #00CFFF; color: #000; font-weight: 700; border: none; }
        .btn-cyan:hover { background: #00b8e0; color: #000; }
        .form-control { background: #0D1E35; border-color: rgba(0,207,255,0.2); color: #fff; }
        .form-control:focus { background: #0D1E35; border-color: #00CFFF; color: #fff; box-shadow: 0 0 0 3px rgba(0,207,255,0.15); }
    </style>
</head>
<body>
<div class="container" style="max-width: 420px;">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show mb-3" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="auth-card p-4 p-md-5 shadow-lg">
        <div class="text-center mb-4">
            <i class="bi bi-phone-fill fs-1" style="color:#00CFFF;"></i>
            <h2 class="brand-title mt-2">Tecnocel CRM</h2>
            <p class="text-muted small">Inicia sesión en tu negocio</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">CORREO ELECTRÓNICO</label>
                <input type="email" name="email" class="form-control"
                       value="{{ email }}" placeholder="tucorreo@gmail.com" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small fw-bold">CONTRASEÑA</label>
                <input type="password" name="password" class="form-control"
                       placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-cyan w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-2"></i>Entrar al CRM
            </button>
        </form>

        <hr class="my-4" style="border-color: rgba(0,207,255,0.1);">

        <p class="text-center text-muted small mb-0">
            ¿Aún no tienes cuenta?
            <a href="{{ url_for('auth.registro') }}" style="color:#00CFFF;">Regístrate gratis</a>
        </p>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
