<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Tecnocel CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0a0e1a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif;
               min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-admin { background: #111827; border: 1px solid rgba(0,229,255,0.3);
                      border-radius: 16px; padding: 2.5rem; max-width: 400px; width: 100%;
                      box-shadow: 0 0 40px rgba(0,229,255,0.08); }
        h3 { color: #00e5ff; font-weight: 700; text-align: center; margin-bottom: 1.5rem; }
        .form-control { background: #1a2035; border: 1px solid #333; color: #e0e0e0; border-radius: 8px; }
        .form-control:focus { background: #1a2035; border-color: #00e5ff; color: #e0e0e0;
                              box-shadow: 0 0 0 2px rgba(0,229,255,0.15); }
        .btn-admin { background: linear-gradient(135deg, #00b4d8, #00e5ff); border: none;
                     color: #000; font-weight: 700; padding: 12px; border-radius: 8px;
                     width: 100%; font-size: 1rem; }
        .badge-admin { background: rgba(255,165,0,0.15); border: 1px solid orange;
                       color: orange; border-radius: 20px; padding: 4px 14px;
                       font-size: 0.8rem; display: inline-block; margin-bottom: 1rem; }
        label { color: #aaa; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="card-admin">
    <div class="text-center mb-3">
        <div class="badge-admin"><i class="fas fa-shield-alt me-1"></i> Panel de Administrador</div>
    </div>
    <h3><i class="fas fa-tools me-2"></i>Tecnocel CRM</h3>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
            <div class="alert alert-{{ 'danger' if cat == 'danger' else 'success' }} py-2">{{ msg }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <div class="mb-3">
            <label>Usuario administrador</label>
            <input type="text" name="usuario" class="form-control mt-1" placeholder="admin" required autocomplete="off">
        </div>
        <div class="mb-4">
            <label>Contraseña</label>
            <input type="password" name="clave" class="form-control mt-1" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-admin">
            <i class="fas fa-sign-in-alt me-2"></i> Ingresar al panel
        </button>
    </form>
</div>
</body>
</html>
